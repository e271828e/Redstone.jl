name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'design/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'design/**', '**.md']
  workflow_dispatch:
concurrency:
  # One run per branch at a time: a pull request cancels its superseded runs,
  # while a master run always finishes and only queued ones are skipped.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:  # lets julia-actions/cache delete the old caches it created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.13']
    defaults:
      run:
        shell: bash  # the gate line is bash syntax; Windows defaults to PowerShell
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Instantiate the workspace
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Run the gate
        run: >-
          JULIA_LOAD_PATH="@" julia -t auto --startup-file=no --check-bounds=yes
          --warn-overwrite=yes --depwarn=yes --project=test test/runtests.jl
